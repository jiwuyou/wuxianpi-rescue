server {
    listen 80;
    listen [::]:80;
    server_name wuxianpirescue.webefficacy.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wuxianpirescue.webefficacy.com;

    ssl_certificate /etc/letsencrypt/live/wuxianpirescue.webefficacy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wuxianpirescue.webefficacy.com/privkey.pem;

    client_max_body_size 2m;

    # Publishing is restricted to the local host or a Tailscale/private path;
    # the application still requires the bearer token as a second gate.
    location ^~ /api/v1/management/ {
        client_max_body_size 64m;
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:20877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/v2/management/ {
        client_max_body_size 64m;
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:20877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:20877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
